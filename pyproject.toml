[project]
name = "debate-tool"
version = "0.1.0"
description = "A local tool where Claude and ChatGPT debate a user's idea and hold their own perspectives."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
debate-tool = "debate_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
